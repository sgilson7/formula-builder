<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Reference default. connect-src 'self' keeps fetches on this origin;
       'wasm-unsafe-eval' lets the page compile its own WebAssembly module;
       form-action 'none' blocks form posts. A meta policy cannot stop data
       leaving by navigation, so the browser check still watches requests. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Formula Builder</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body data-ready="false" data-mode="edit">
  <header class="bar">
    <div class="brand"><span class="logo" aria-hidden="true">Σ</span><h1 id="title"></h1></div>
    <div class="group" role="group" aria-labelledby="view-label"><span id="view-label" class="small" data-s="view"></span><div id="views" class="seg"></div></div>
    <div class="group">
      <label class="small" for="examples" data-s="examples"></label>
      <select id="examples"></select>
      <button id="new" type="button" data-s="new"></button>
      <label class="button file"><span data-s="open"></span><input id="open" type="file" accept=".json,application/json"></label>
      <button id="save" type="button" data-s="save"></button>
    </div>
    <div class="group exports">
      <span class="small" data-s="export"></span>
      <button type="button" class="primary" data-export="png" data-s="export_png"></button>
      <button type="button" class="primary" data-export="svg" data-s="export_svg"></button>
      <button type="button" class="primary" data-export="gif" data-s="export_gif"></button>
      <button type="button" class="primary" data-export="latex" data-s="export_latex"></button>
      <button type="button" class="embed" data-export="embed" data-s="export_embed"></button>
      <button type="button" data-export="link" data-s="export_link"></button>
      <label class="small" for="size" data-s="export_size"></label>
      <label class="small check"><input id="clear" type="checkbox"> <span data-s="export_clear"></span></label>
      <select id="size"><option value="600">600 px</option><option value="1200" selected>1200 px</option><option value="2400">2400 px</option></select>
    </div>
  </header>

  <div id="intro" class="intro"><p></p><p class="privacy" data-s="privacy"></p></div>

  <main class="layout">
    <section class="panel editor" aria-labelledby="h-formulas">
      <label class="field"><span class="head" data-s="doc_title"></span><input id="doc-title" type="text" spellcheck="false"></label>
      <label class="field"><span class="head" id="h-formulas" data-s="formulas"></span><span class="help" data-s="formulas_help"></span>
        <textarea id="formulas" rows="4" spellcheck="false" class="code"></textarea></label>
      <label class="field"><span class="head" data-s="sheet"></span><span class="help" data-s="sheet_help"></span>
        <textarea id="sheet" rows="16" spellcheck="false" class="code"></textarea></label>
      <details class="help ref"><summary data-s="reference"></summary><p class="code-ref" data-s="sheet_reference"></p></details>
      <label class="field"><span class="head" data-s="prose"></span><span class="help" data-s="prose_help"></span>
        <textarea id="prose" rows="4"></textarea></label>
      <div id="errors" class="errors" role="status" hidden><strong data-s="errors"></strong><ul></ul></div>
    </section>

    <section class="panel reader" aria-labelledby="h-reader">
      <h2 id="h-reader" class="head" data-s="reader"></h2>
      <div id="formula" class="formula" aria-live="polite"></div>
      <p id="prose-out" class="prose-out"></p>
      <div id="controls" class="controls"></div>
      <div id="plot" class="plot"></div>
      <p id="plot-error" class="plot-error" hidden></p>
      <div id="stepbar" class="stepbar" hidden>
        <button id="play" type="button" class="primary"></button>
        <button id="prev" type="button" data-s="prev"></button>
        <ol id="steps"></ol>
        <button id="next" type="button" data-s="next"></button>
      </div>
      <p class="help" data-s="help_scrub"></p>
    </section>

    <aside class="panel concepts" aria-labelledby="h-concepts">
      <div class="row"><h2 id="h-concepts" class="head" data-s="concepts"></h2><span id="budget" class="small"></span></div>
      <div id="meter" class="meter" aria-hidden="true"></div>
      <p class="help" data-s="budget_note"></p>
      <ol id="concept-list" class="concept-list"></ol>
      <div class="selection">
        <p><span class="small" data-s="selected"></span> <code id="selection"></code></p>
        <button id="add" type="button" class="primary" data-s="add_concept"></button>
        <p id="no-selection" class="help" data-s="no_selection"></p>
      </div>
      <details class="about"><summary data-s="about"></summary><p data-s="about_text"></p></details>
    </aside>
  </main>
  <p id="message" role="status"></p>

  <dialog id="copy-dialog">
    <p class="help" data-s="copy_help"></p>
    <textarea id="copy-text" rows="10" readonly class="code"></textarea>
    <div class="row"><button id="copy" type="button" class="primary" data-s="copy"></button><button id="close" type="button" data-s="close"></button></div>
  </dialog>
  <noscript><p>This page needs JavaScript and WebAssembly.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
